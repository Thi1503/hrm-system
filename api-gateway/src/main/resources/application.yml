server:
  port: 8086

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        - id: identity-service
          uri: http://localhost:8080
          predicates:
            - Path=/identity/**

        - id: employee-service
          uri: http://localhost:8081
          predicates:
            - Path=/employee/**

        - id: attendance-service
          uri: http://localhost:8082
          predicates:
            - Path=/attendance/**

        - id: request-approval-service
          uri: http://localhost:8083
          predicates:
            - Path=/request-approval/**

        - id: payroll-service
          uri: http://localhost:8084
          predicates:
            - Path=/payroll/**

        - id: notification-service
          uri: http://localhost:8085
          predicates:
            - Path=/notification/**


springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: identity
        url: /identity/v3/api-docs

      - name: employee
        url: /employee/v3/api-docs

      - name: attendance
        url: /attendance/v3/api-docs

      - name: request-approval
        url: /request-approval/v3/api-docs

      - name: payroll
        url: /payroll/v3/api-docs

      - name: notification
        url: /notification/v3/api-docs

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

  endpoints:
    web:
      exposure:
        include: health,info

