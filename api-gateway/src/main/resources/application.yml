server:
  port: 8086

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        - id: identity-service
          uri: http://localhost:8080
          predicates:
            - Path=/identity/**

        - id: employee-service
          uri: http://localhost:8081
          predicates:
            - Path=/employee/**

        - id: attendance-service
          uri: http://localhost:8082
          predicates:
            - Path=/attendance/**

        - id: request-approval-service
          uri: http://localhost:8083
          predicates:
            - Path=/request-approval/**

        - id: payroll-service
          uri: http://localhost:8084
          predicates:
            - Path=/payroll/**

        - id: notification-service
          uri: http://localhost:8085
          predicates:
            - Path=/notification/**
