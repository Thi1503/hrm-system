server:
  port: 8083
  servlet:
    context-path: /request-approval

spring:
  application:
    name: request-approval-service

  datasource:
    url: jdbc:mysql://localhost:3307/request_approval_service
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

employee:
  service:
    url: http://localhost:8081/employee

# ================== TRACING (ZIPKIN) ==================
management:
  tracing:
    sampling:
      probability: 1.0   # Trace 100% request (MVP đồ án)

  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
      # ⚠️ dùng localhost vì service chạy ngoài Docker

  endpoints:
    web:
      exposure:
        include: health,info
