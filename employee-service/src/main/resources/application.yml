server:
  port: 8081
  servlet:
    context-path: /employee

spring:
  application:
    name: employee-service

  datasource:
    url: jdbc:mysql://localhost:3307/employee_service
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  cloud:
    openfeign:
      micrometer:
        enabled: true

jwt:
  secret: 5a17ebf57445277d088804588e896e6ae347ec9815f9f9f0b95065101e022eb8
  expiration-days: 180

# ================== TRACING (ZIPKIN) ==================
management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0   # Trace 100% request (MVP đồ án)
    propagation:
      type: b3
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
      # ⚠️ dùng localhost vì service chạy ngoài Docker

  endpoints:
    web:
      exposure:
        include: health,info
